name: Windows source verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, visual and build
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the pinned Playwright Chromium runtime
        run: npx --no-install playwright install chromium

      - name: Verify open-source notices and corresponding-source lock
        run: npm run verify:licenses

      - name: Generate CycloneDX and SPDX software bills of materials
        run: npm run generate:sbom

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Browser-extension verification
        run: npm run verify --prefix browser-extensions/maer-password-vault

      - name: WhatsApp/MAER visual regression tests
        run: npm run test:visual

      - name: Build source tree
        run: npm run build

      - name: Package an unsigned directory for layout verification
        run: npx --no-install electron-builder --win --dir

      - name: Verify licenses in the packaged application
        run: npm run verify:licenses:packaged

      - name: Verify every Electron fuse is explicit
        run: npm run verify:fuses:packaged

      - name: Smoke-test the actual packaged executable and Native Messaging host
        run: npm run test:e2e:packaged

      - name: Reject active references to the retired domain
        shell: pwsh
        run: |
          $matches = git grep -n -i -E 'contacts\.chaumont\.me|chaumont\.me' -- .
          if ($LASTEXITCODE -eq 0) {
            $matches
            throw 'Une reference active au domaine retire a ete detectee.'
          }
          if ($LASTEXITCODE -ne 1) {
            throw 'La verification du domaine retire a echoue.'
          }
